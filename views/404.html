<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | E-Shop</title>
    <link rel="stylesheet" href="/styles.css">
    
</head>
<body>
    <main class="error-container">
        <!-- Animated 404 Code -->
        <div class="glitch-wrapper">404</div>

        <!-- Sleek SVG Illustration (Lost Astronaut in Space) -->
        <svg class="illustration" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="250" cy="250" r="200" fill="#242424" stroke="#333333" stroke-width="4"/>
            <!-- Planet / Moon -->
            <circle cx="180" cy="180" r="40" fill="#3a3a3a"/>
            <circle cx="160" cy="170" r="10" fill="#2d2d2d"/>
            <circle cx="195" cy="195" r="14" fill="#2d2d2d"/>
            <!-- Stars -->
            <circle cx="110" cy="120" r="3" fill="#ff3b30"/>
            <circle cx="360" cy="150" r="2" fill="#ffffff" opacity="0.8"/>
            <circle cx="320" cy="310" r="3" fill="#ffffff" opacity="0.5"/>
            <circle cx="140" cy="340" r="2" fill="#ff3b30"/>
            <circle cx="390" cy="240" r="4" fill="#ffffff" opacity="0.9"/>
            <!-- Ghost / Lost Signal Radar Lines -->
            <circle cx="250" cy="250" r="120" stroke="#ff3b30" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
            <circle cx="250" cy="250" r="160" stroke="#444444" stroke-width="2" stroke-dasharray="10 10" opacity="0.3"/>
            <!-- Warning Sign Graphic -->
            <path d="M250 190 L290 270 H210 Z" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linejoin="round"/>
            <text x="250" y="255" fill="#ff3b30" font-size="24" font-weight="bold" text-anchor="middle">!</text>
        </svg>

        <h1 class="error-title">Lost in Cyberspace</h1>
        <p class="error-description">
            Oops! The page you are searching for might have been moved, renamed, or no longer exists.
        </p>

        <a href="/" class="btn-home">Return to Safety</a>
    </main>
</body>
</html>
